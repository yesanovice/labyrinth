<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LABYRINTH — Blind Maze Duel</title>
  <meta name="description" content="A high-stakes two-player pass-and-play blind maze duel. Build secret mazes with 20 walls and duel blind to reach the exit." />
  <meta property="og:title" content="LABYRINTH — Blind Maze Duel" />
  <meta property="og:description" content="A high-stakes two-player pass-and-play blind maze duel. Build secret mazes with 20 walls and duel blind to reach the exit." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Typography: Cinzel for high-stakes titles, IBM Plex Mono for coordinates and logs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       0. DESIGN TOKENS (Dark Gambling Den / Kakerou)
       ========================================================================== */
    :root {
      --bg: #0b0b0d;
      --panel: #141216;
      --panel-2: #1b181d;
      --line: #2a252c;
      --crimson: #8b0a1a;
      --crimson-bright: #c0182f;
      --gold: #c9a24a;
      --gold-dim: #8a6f33;
      --ink: #e8e2d4;
      --muted: #8d867a;
      --danger: #c0182f;
      --ok: #6fae75;

      --font-display: 'Cinzel', 'Playfair Display', Georgia, serif;
      --font-mono: 'IBM Plex Mono', 'Space Mono', ui-monospace, Menlo, monospace;
    }

    /* Base Reset & Felt Canvas */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle felt texture, radial spotlight & vignette */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 30%, rgba(201, 162, 74, 0.08) 0%, rgba(11, 11, 13, 0) 70%),
        radial-gradient(circle at 50% 90%, rgba(139, 10, 26, 0.06) 0%, rgba(11, 11, 13, 0) 65%);
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.9);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1rem 1rem 3rem 1rem;
      max-width: 640px;
      margin: 0 auto;
    }

    /* Common Components & Typography */
    h1, h2, h3 {
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--gold);
      text-shadow: 0 0 20px rgba(201, 162, 74, 0.25);
    }

    .kicker {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--gold-dim);
      margin-bottom: 0.4rem;
      text-align: center;
    }

    .subtitle {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-align: center;
      margin-top: 0.35rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.65rem 1.4rem;
      background: var(--panel-2);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      cursor: pointer;
      transition: all 180ms ease;
      touch-action: manipulation;
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      background: var(--gold-dim);
      color: #0b0b0d;
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(201, 162, 74, 0.35);
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: var(--line);
    }

    .btn-gold {
      background: linear-gradient(135deg, #a68436 0%, #c9a24a 100%);
      color: #0b0b0d;
      border-color: var(--gold);
      font-weight: 700;
    }

    .btn-gold:hover:not(:disabled) {
      background: linear-gradient(135deg, #c9a24a 0%, #e2be67 100%);
      box-shadow: 0 0 20px rgba(201, 162, 74, 0.5);
    }

    .btn-crimson {
      background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-bright) 100%);
      color: #ffffff;
      border-color: var(--crimson-bright);
    }

    .btn-crimson:hover:not(:disabled) {
      background: #d81c35;
      box-shadow: 0 0 16px rgba(192, 24, 47, 0.5);
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--muted);
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink);
      border-color: var(--gold-dim);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 4px;
    }

    /* Text Inputs */
    .input-field {
      min-height: 48px;
      background: #0f0d11;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.65rem 1rem;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 1rem;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
      width: 100%;
    }

    .input-field:focus {
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(201, 162, 74, 0.25);
    }

    .input-field::placeholder {
      color: rgba(141, 134, 122, 0.6);
      font-size: 0.9rem;
    }

    /* Top Utility Bar */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(42, 37, 44, 0.6);
    }

    .top-bar-brand {
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      font-weight: 700;
    }

    /* Board Container */
    .board-wrapper {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 1 / 1;
      margin: 0.5rem auto 1rem auto;
      border: 1px solid rgba(138, 111, 51, 0.4);
      background: #0e0c10;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board-svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
    }

    /* Wall / Passage SVG Styling */
    .svg-cell {
      fill: #141216;
      stroke: var(--gold-dim);
      stroke-width: 0.65;
      stroke-opacity: 0.22;
      transition: fill 150ms ease;
    }

    .svg-cell:hover {
      fill: #19161c;
    }

    .svg-grid-border {
      fill: none;
      stroke: var(--gold-dim);
      stroke-width: 1.5;
      stroke-opacity: 0.5;
    }

    .svg-wall {
      stroke: var(--crimson-bright);
      stroke-width: 7;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px rgba(192, 24, 47, 0.7));
    }

    .svg-wall-flash {
      animation: wallReveal 400ms ease-out forwards;
    }

    @keyframes wallReveal {
      0% {
        stroke: #ffffff;
        stroke-width: 10;
        filter: drop-shadow(0 0 12px #ffffff);
      }
      50% {
        stroke: #ff526a;
        stroke-width: 8;
        filter: drop-shadow(0 0 8px rgba(255, 82, 106, 0.9));
      }
      100% {
        stroke: var(--crimson-bright);
        stroke-width: 7;
        filter: drop-shadow(0 0 4px rgba(192, 24, 47, 0.7));
      }
    }

    .svg-passage {
      stroke: var(--gold);
      stroke-width: 2.5;
      stroke-dasharray: 6 5;
      stroke-linecap: round;
      opacity: 0.85;
    }

    .svg-token-outer {
      fill: #141216;
      stroke: var(--gold);
      stroke-width: 3.5;
      filter: drop-shadow(0 0 8px rgba(201, 162, 74, 0.75));
      transition: cx 180ms ease, cy 180ms ease;
    }

    .svg-token-inner {
      fill: var(--gold);
      transition: cx 180ms ease, cy 180ms ease;
    }

    .svg-coord-label {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      fill: var(--gold-dim);
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.05em;
    }

    .svg-tag-rect {
      stroke-width: 1.2;
      rx: 2;
    }

    .svg-tag-text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.08em;
    }

    /* Message / Status Bar */
    .status-msg {
      width: 100%;
      min-height: 24px;
      font-size: 0.875rem;
      text-align: center;
      margin: 0.4rem 0 0.8rem 0;
      padding: 0.35rem 0.5rem;
      border-radius: 3px;
      color: var(--ink);
      transition: opacity 150ms ease;
    }

    .status-msg.error {
      color: #ff6b7e;
      background: rgba(192, 24, 47, 0.12);
      border: 1px solid rgba(192, 24, 47, 0.3);
    }

    .status-msg.success {
      color: #8ae392;
      background: rgba(111, 174, 117, 0.12);
      border: 1px solid rgba(111, 174, 117, 0.3);
    }

    .status-msg.blocked {
      color: #ff526a;
      background: rgba(192, 24, 47, 0.18);
      border: 1px solid rgba(192, 24, 47, 0.5);
      font-weight: 600;
    }

    /* Input Bar */
    .action-bar {
      width: 100%;
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    /* Wall Chips */
    .chips-panel {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.6rem;
      margin-bottom: 0.8rem;
      max-height: 120px;
      overflow-y: auto;
    }

    .chips-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .wall-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.5rem;
      background: #1e1a22;
      border: 1px solid rgba(192, 24, 47, 0.4);
      border-radius: 3px;
      font-size: 0.75rem;
      color: #f0c5cb;
    }

    .wall-chip-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
      padding: 0 0.15rem;
      transition: color 150ms ease;
    }

    .wall-chip-btn:hover {
      color: #ff526a;
    }

    /* Move Log */
    .log-panel {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      margin-top: 0.5rem;
      max-height: 140px;
      overflow-y: auto;
    }

    .log-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--gold-dim);
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
    }

    .log-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .log-entry {
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      padding: 0.15rem 0;
      border-bottom: 1px dashed rgba(42, 37, 44, 0.4);
    }

    .log-entry.open {
      color: var(--gold);
    }

    .log-entry.blocked {
      color: var(--crimson-bright);
    }

    /* BLOCKED Ink-Stamp Overlay */
    .blocked-stamp-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(11, 11, 13, 0.65);
      z-index: 20;
      cursor: pointer;
    }

    .ink-stamp {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 0.25em;
      color: var(--crimson-bright);
      border: 4px solid var(--crimson-bright);
      padding: 0.4rem 1.4rem;
      text-transform: uppercase;
      transform: rotate(-12deg);
      box-shadow: 0 0 25px rgba(192, 24, 47, 0.8), inset 0 0 15px rgba(192, 24, 47, 0.4);
      animation: inkStampAnim 280ms cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      background: rgba(20, 18, 22, 0.9);
      user-select: none;
    }

    @keyframes inkStampAnim {
      0% {
        opacity: 0;
        transform: scale(2.5) rotate(-24deg);
      }
      60% {
        opacity: 1;
        transform: scale(0.95) rotate(-10deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(-12deg);
      }
    }

    /* Full-screen Handoff Privacy Curtain */
    .handoff-curtain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 100;
      text-align: center;
      animation: curtainFade 250ms ease-out;
    }

    @keyframes curtainFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .curtain-title {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      color: var(--gold);
      margin-bottom: 1rem;
      max-width: 500px;
    }

    .curtain-desc {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 2.5rem;
      max-width: 420px;
      letter-spacing: 0.05em;
    }

    /* Coin Flip Screen */
    .coin-wrapper {
      perspective: 1000px;
      margin: 2rem auto;
      width: 140px;
      height: 140px;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      border-radius: 50%;
      animation: coinSpin 1.2s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      border: 3px solid var(--gold);
      background: radial-gradient(circle, #e2be67 0%, #a68436 70%, #5d4617 100%);
      color: #0b0b0d;
      box-shadow: 0 0 25px rgba(201, 162, 74, 0.5);
    }

    .coin-face.back {
      transform: rotateY(180deg);
      background: radial-gradient(circle, #e8a6a6 0%, #8b0a1a 70%, #4a030c 100%);
      border-color: #ff526a;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(192, 24, 47, 0.5);
    }

    .coin-symbol {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 800;
    }

    .coin-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    @keyframes coinSpin {
      0% { transform: rotateY(0deg) scale(0.8); }
      50% { transform: rotateY(900deg) scale(1.15); }
      100% { transform: rotateY(var(--coin-target-deg, 1800deg)) scale(1); }
    }

    /* Rules Screen */
    .rules-panel {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1.5rem;
      margin-top: 1rem;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .rules-quickstart {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      padding: 1rem;
      background: #0e0c10;
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
    }

    .rules-step {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--ink);
    }

    .rules-step-badge {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--gold-dim);
      color: #0b0b0d;
      font-weight: 700;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .rules-section {
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(42, 37, 44, 0.6);
    }

    .rules-section:last-child {
      border-bottom: none;
      margin-bottom: 0.5rem;
    }

    .rules-heading {
      font-size: 1.05rem;
      color: var(--gold);
      text-align: left;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .rules-text {
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    .rules-callout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin: 0.75rem 0;
    }

    @media (max-width: 520px) {
      .rules-callout-grid {
        grid-template-columns: 1fr;
      }
    }

    .rules-card-open {
      background: rgba(111, 174, 117, 0.08);
      border: 1px solid rgba(111, 174, 117, 0.4);
      border-radius: 4px;
      padding: 0.85rem;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    .rules-card-blocked {
      background: rgba(192, 24, 47, 0.08);
      border: 1px solid rgba(192, 24, 47, 0.4);
      border-radius: 4px;
      padding: 0.85rem;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    .rules-card-title {
      font-family: var(--font-display);
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }

    .rules-card-open .rules-card-title {
      color: #8ae392;
    }

    .rules-card-blocked .rules-card-title {
      color: #ff6b7e;
    }

    .rules-note-box {
      background: #19161c;
      border: 1px solid rgba(201, 162, 74, 0.3);
      border-radius: 4px;
      padding: 0.75rem 0.9rem;
      margin: 0.75rem 0;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink);
    }

    .rules-diagram {
      margin: 1rem auto;
      max-width: 320px;
      background: #0f0d11;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.5rem;
      display: flex;
      justify-content: center;
    }

    /* Game Over Screen Reveal */
    .gameover-mazes {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }

    @media (min-width: 600px) {
      .gameover-mazes {
        grid-template-columns: 1fr 1fr;
      }
    }

    .maze-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .maze-card-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .stat-badge {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    /* Modal dialog */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      padding: 1rem;
    }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      padding: 1.5rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    }

    /* Prefers-reduced-motion accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .coin {
        animation: none !important;
        transform: rotateY(var(--coin-target-deg, 0deg)) !important;
      }
      .ink-stamp {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" role="main"></div>

  <!-- Vanilla JS Engine -->
  <script>
    (function () {
      'use strict';

      /* ==========================================================================
         1. CONSTANTS & DATA MODEL (Section 4 & 5)
         ========================================================================== */
      const WALL_COUNT = 20;
      const SIZE = 6;
      const COLS = 'ABCDEF';

      // State machine root
      let state = {
        phase: 'TITLE', // 'TITLE' | 'RULES' | 'HANDOFF' | 'BUILD' | 'COINFLIP' | 'SOLVE' | 'GAMEOVER'
        names: ['Player 1', 'Player 2'],
        mazes: [
          { entrance: null, exit: null, walls: new Set() },
          { entrance: null, exit: null, walls: new Set() }
        ],
        solves: [
          { pos: null, knownOpen: new Set(), knownWalls: new Set(), guesses: 0, log: [] },
          { pos: null, knownOpen: new Set(), knownWalls: new Set(), guesses: 0, log: [] }
        ],
        current: 0,       // whose turn (building: 0 or 1; solving: 0 or 1)
        firstSolver: 0,   // decided by coin flip
        winner: null,     // 0 or 1
        returnTo: null,   // phase to return to after closing Rules screen
        handoffTarget: 0, // player index to hand off to
        handoffNextPhase: 'BUILD',
        blockedStampActive: false, // momentary visual indicator for blocked moves
        currentMessage: { text: '', type: 'normal' }
      };

      /* ==========================================================================
         2. CORE PURE FUNCTIONS & HELPERS (Section 3 & 10)
         ========================================================================== */
      /**
       * Converts 0-indexed row (0..5) and col (0..5) to square label e.g. "A1"
       */
      function label(row, col) {
        if (col < 0 || col >= SIZE || row < 0 || row >= SIZE) return null;
        return COLS[col] + (row + 1);
      }

      /**
       * Parses square string like "C3" into { row, col, label }. Returns null if invalid.
       */
      function parse(str) {
        if (!str || typeof str !== 'string') return null;
        const trimmed = str.trim().toUpperCase();
        const match = trimmed.match(/^([A-F])([1-6])$/);
        if (!match) return null;
        const col = COLS.indexOf(match[1]);
        const row = parseInt(match[2], 10) - 1;
        return { row, col, label: match[1] + match[2] };
      }

      /**
       * Determines if two square labels are orthogonally adjacent (up/down/left/right only).
       */
      function isAdjacent(labelA, labelB) {
        const pa = parse(labelA);
        const pb = parse(labelB);
        if (!pa || !pb) return false;
        const dRow = Math.abs(pa.row - pb.row);
        const dCol = Math.abs(pa.col - pb.col);
        return (dRow === 1 && dCol === 0) || (dRow === 0 && dCol === 1);
      }

      /**
       * Returns normalized edge key: two labels sorted alphabetically and joined by "-"
       * e.g. edgeKey("B3", "A3") -> "A3-B3"
       */
      function edgeKey(labelA, labelB) {
        const a = labelA.trim().toUpperCase();
        const b = labelB.trim().toUpperCase();
        const sorted = [a, b].sort();
        return `${sorted[0]}-${sorted[1]}`;
      }

      /**
       * Returns true if wall exists in the given set
       */
      function hasWall(wallsSet, labelA, labelB) {
        if (!wallsSet) return false;
        return wallsSet.has(edgeKey(labelA, labelB));
      }

      /**
       * Returns list of orthogonal neighbor square labels for a given square
       */
      function neighbors(cellLabel) {
        const p = parse(cellLabel);
        if (!p) return [];
        const res = [];
        const deltas = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        for (let i = 0; i < deltas.length; i++) {
          const nr = p.row + deltas[i][0];
          const nc = p.col + deltas[i][1];
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
            res.push(label(nr, nc));
          }
        }
        return res;
      }

      /**
       * Generates all 60 possible edges on the 6x6 grid
       */
      function getAllEdges() {
        const edges = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const cur = label(r, c);
            if (c < SIZE - 1) {
              edges.push(edgeKey(cur, label(r, c + 1)));
            }
            if (r < SIZE - 1) {
              edges.push(edgeKey(cur, label(r + 1, c)));
            }
          }
        }
        return edges;
      }

      /**
       * Breadth-First Search verifying solvability between entrance and exit
       */
      function bfsSolvable(entrance, exit, wallsSet) {
        if (!entrance || !exit || entrance === exit) return false;
        const queue = [entrance];
        const visited = new Set([entrance]);

        while (queue.length > 0) {
          const cur = queue.shift();
          if (cur === exit) return true;
          const neighs = neighbors(cur);
          for (let i = 0; i < neighs.length; i++) {
            const n = neighs[i];
            const ek = edgeKey(cur, n);
            if (!wallsSet.has(ek) && !visited.has(n)) {
              visited.add(n);
              queue.push(n);
            }
          }
        }
        return false;
      }

      /**
       * Generates a guaranteed valid, solvable random maze with exactly WALL_COUNT walls
       */
      function randomMaze() {
        const allCells = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            allCells.push(label(r, c));
          }
        }
        // Shuffle cells to pick entrance and exit
        const shuffled = [...allCells].sort(() => Math.random() - 0.5);
        const ent = shuffled[0];
        const pEnt = parse(ent);
        // Ensure entrance and exit have distance >= 3
        const candidates = shuffled.slice(1).filter(c => {
          const pC = parse(c);
          return (Math.abs(pC.row - pEnt.row) + Math.abs(pC.col - pEnt.col)) >= 3;
        });
        const ext = candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : shuffled[1];

        const walls = new Set();
        const allEdges = getAllEdges().sort(() => Math.random() - 0.5);

        for (let i = 0; i < allEdges.length; i++) {
          const edge = allEdges[i];
          walls.add(edge);
          if (!bfsSolvable(ent, ext, walls)) {
            walls.delete(edge);
          }
          if (walls.size === WALL_COUNT) {
            break;
          }
        }

        // Safety fallback: if under 20 walls due to order, recurse
        if (walls.size < WALL_COUNT) {
          return randomMaze();
        }

        return { entrance: ent, exit: ext, walls };
      }

      /**
       * Parses wall input representation (e.g. "a3-b3", "a3 - b3", "a3–b3", "a3 b3")
       */
      function parseEdgeInput(str) {
        if (!str || typeof str !== 'string') {
          return { ok: false, message: 'Unreadable. Use a square like B3.' };
        }
        // Replace en-dash, em-dash, and whitespace separators with a single hyphen
        const cleaned = str.trim().toLowerCase()
          .replace(/[\s\u2013\u2014]+/g, '-')
          .replace(/-+/g, '-');

        const parts = cleaned.split('-');
        if (parts.length !== 2) {
          return { ok: false, message: 'Walls sit between two neighboring squares, e.g. A3-B3.' };
        }

        const sq1 = parts[0];
        const sq2 = parts[1];

        // Check format
        const p1 = parse(sq1);
        const p2 = parse(sq2);
        if (!p1 || !p2) {
          return { ok: false, message: 'That square is not on the board.' };
        }

        if (!isAdjacent(p1.label, p2.label)) {
          return { ok: false, message: 'Walls sit between two neighboring squares, e.g. A3-B3.' };
        }

        return { ok: true, edgeKey: edgeKey(p1.label, p2.label) };
      }

      /**
       * Pure resolution of a move command in SOLVE mode (Section 7.5)
       */
      function resolveMove(targetStr, currentPos, opponentWalls, opponentExit) {
        if (!targetStr || typeof targetStr !== 'string') {
          return { status: 'MALFORMED', message: 'Unreadable. Use a square like B3.' };
        }
        const trimmed = targetStr.trim().toLowerCase();
        // 1. Malformed check
        if (!/^[a-f][1-6]$/.test(trimmed)) {
          return { status: 'MALFORMED', message: 'Unreadable. Use a square like B3.' };
        }
        const target = trimmed.toUpperCase();

        // 2. Not orthogonally adjacent
        if (!isAdjacent(currentPos, target)) {
          return { status: 'NOT_ADJACENT', message: 'You can only step to a neighboring square.' };
        }

        // 3. Wall blocks move
        const ek = edgeKey(currentPos, target);
        if (opponentWalls.has(ek)) {
          return {
            status: 'BLOCKED',
            edge: ek,
            target: target,
            message: `BLOCKED. Wall between ${currentPos} and ${target}. Turn passes.`
          };
        }

        // 4. Move succeeds
        const isWin = (target === opponentExit);
        return {
          status: 'OPEN',
          edge: ek,
          target: target,
          isWin: isWin,
          message: isWin ? `Reaches the exit! Victory!` : `OPEN. You stand on ${target}.`
        };
      }

      /* ==========================================================================
         3. SELF-TEST RUNNER (Section 10)
         ========================================================================== */
      window.runSelfTests = function () {
        console.group('%c[LABYRINTH TEST SUITE]', 'color: #c9a24a; font-weight: bold;');
        let passed = 0;
        let failed = 0;

        function assert(condition, desc) {
          if (condition) {
            console.log(`%c[PASS]%c ${desc}`, 'color: #6fae75; font-weight: bold;', 'color: inherit;');
            passed++;
          } else {
            console.error(`[FAIL] ${desc}`);
            failed++;
          }
        }

        // 1. edgeKey order independence
        assert(edgeKey('A1', 'A2') === 'A1-A2', 'edgeKey A1-A2 normalizes');
        assert(edgeKey('A2', 'A1') === 'A1-A2', 'edgeKey A2-A1 matches A1-A2 order-independently');
        assert(edgeKey('b3', 'A3') === 'A3-B3', 'edgeKey case-insensitive and alphabetical');

        // 2. isAdjacent tests
        assert(isAdjacent('A1', 'A2') === true, 'A1 and A2 are adjacent (down)');
        assert(isAdjacent('A1', 'B1') === true, 'A1 and B1 are adjacent (right)');
        assert(isAdjacent('B2', 'B1') === true, 'B2 and B1 are adjacent (up)');
        assert(isAdjacent('B2', 'A2') === true, 'B2 and A2 are adjacent (left)');
        assert(isAdjacent('A1', 'B2') === false, 'A1 and B2 diagonal rejection');
        assert(isAdjacent('A1', 'A1') === false, 'Same square rejection');
        assert(isAdjacent('A1', 'A3') === false, 'Distance 2 square rejection');
        assert(isAdjacent('A1', 'Z9') === false, 'Off-grid square rejection');

        // 3. BFS Solvability tests
        const emptyWalls = new Set();
        assert(bfsSolvable('A1', 'F6', emptyWalls) === true, 'Empty board is solvable');

        // Surround A1 with walls (A1-A2, A1-B1)
        const trappedA1 = new Set(['A1-A2', 'A1-B1']);
        assert(bfsSolvable('A1', 'F6', trappedA1) === false, 'Surrounded entrance is unsolvable');
        assert(bfsSolvable('A1', 'A1', emptyWalls) === false, 'Entrance equal to exit is invalid');

        // 4. resolveMove test cases
        const testWalls = new Set(['C3-C4', 'C3-D3']);
        const resMal = resolveMove('invalid', 'C3', testWalls, 'F6');
        assert(resMal.status === 'MALFORMED', 'Invalid text rejected with MALFORMED');

        const resDiag = resolveMove('D4', 'C3', testWalls, 'F6');
        assert(resDiag.status === 'NOT_ADJACENT', 'Diagonal step rejected with NOT_ADJACENT');

        const resFar = resolveMove('C1', 'C3', testWalls, 'F6');
        assert(resFar.status === 'NOT_ADJACENT', 'Two-step leap rejected with NOT_ADJACENT');

        const resBlocked = resolveMove('C4', 'C3', testWalls, 'F6');
        assert(resBlocked.status === 'BLOCKED', 'Wall step resolved as BLOCKED');

        const resOpen = resolveMove('B3', 'C3', testWalls, 'F6');
        assert(resOpen.status === 'OPEN' && !resOpen.isWin, 'Open step resolved as OPEN without win');

        const resWin = resolveMove('B3', 'C3', testWalls, 'B3');
        assert(resWin.status === 'OPEN' && resWin.isWin, 'Step to exit resolved as win');

        // 5. randomMaze test
        const rm = randomMaze();
        assert(rm.walls.size === WALL_COUNT, `randomMaze has exactly ${WALL_COUNT} walls (got ${rm.walls.size})`);
        assert(rm.entrance !== rm.exit, 'randomMaze entrance differs from exit');
        assert(bfsSolvable(rm.entrance, rm.exit, rm.walls) === true, 'randomMaze is guaranteed BFS solvable');

        console.log(`%cTotal: ${passed} passed, ${failed} failed.`, 'font-weight: bold; color: #c9a24a;');
        console.groupEnd();
        return { passed, failed };
      };

      /* ==========================================================================
         4. BEFOREUNLOAD LISTENER (Section 6)
         ========================================================================== */
      window.addEventListener('beforeunload', function (e) {
        if (state.phase !== 'TITLE' && state.phase !== 'GAMEOVER') {
          e.preventDefault();
          e.returnValue = 'A duel is in progress. Leaving will forfeit the game.';
          return e.returnValue;
        }
      });

      /* ==========================================================================
         5. SVG BOARD BUILDER (Section 9)
         ========================================================================== */
      /**
       * Generates SVG board representation.
       * @param {Object} options
       * @param {string|null} options.entrance
       * @param {string|null} options.exit
       * @param {Set} options.visibleWalls
       * @param {Set} options.visibleOpen
       * @param {string|null} options.tokenPos
       * @param {string|null} options.flashWall
       * @param {boolean} options.clickableEdges
       * @param {Function} options.onEdgeClick
       * @param {Function} options.onSquareClick
       */
      function createBoardSvg(options) {
        const {
          entrance = null,
          exit = null,
          visibleWalls = new Set(),
          visibleOpen = new Set(),
          tokenPos = null,
          flashWall = null,
          onSquareClick = null
        } = options;

        const margin = 50;
        const cellSize = 90;
        const totalSize = 640;

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', `0 0 ${totalSize} ${totalSize}`);
        svg.setAttribute('class', 'board-svg');
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', '6 by 6 Labyrinth Board');

        // 1. Column coordinate labels (Top & Bottom)
        for (let c = 0; c < SIZE; c++) {
          const x = margin + c * cellSize + cellSize / 2;

          // Top
          const textTop = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          textTop.setAttribute('x', x);
          textTop.setAttribute('y', 28);
          textTop.setAttribute('class', 'svg-coord-label');
          textTop.textContent = COLS[c];
          svg.appendChild(textTop);

          // Bottom
          const textBot = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          textBot.setAttribute('x', x);
          textBot.setAttribute('y', totalSize - 22);
          textBot.setAttribute('class', 'svg-coord-label');
          textBot.textContent = COLS[c];
          svg.appendChild(textBot);
        }

        // 2. Row coordinate labels (Left & Right)
        for (let r = 0; r < SIZE; r++) {
          const y = margin + r * cellSize + cellSize / 2;

          // Left
          const textLeft = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          textLeft.setAttribute('x', 24);
          textLeft.setAttribute('y', y);
          textLeft.setAttribute('class', 'svg-coord-label');
          textLeft.textContent = String(r + 1);
          svg.appendChild(textLeft);

          // Right
          const textRight = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          textRight.setAttribute('x', totalSize - 24);
          textRight.setAttribute('y', y);
          textRight.setAttribute('class', 'svg-coord-label');
          textRight.textContent = String(r + 1);
          svg.appendChild(textRight);
        }

        // 3. Grid squares
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const sqLabel = label(r, c);
            const x = margin + c * cellSize;
            const y = margin + r * cellSize;

            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', x);
            rect.setAttribute('y', y);
            rect.setAttribute('width', cellSize);
            rect.setAttribute('height', cellSize);
            rect.setAttribute('class', 'svg-cell');
            rect.setAttribute('data-square', sqLabel);

            if (onSquareClick) {
              rect.style.cursor = 'pointer';
              rect.addEventListener('click', () => onSquareClick(sqLabel));
            }

            svg.appendChild(rect);
          }
        }

        // 4. Outer border frame
        const frame = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        frame.setAttribute('x', margin);
        frame.setAttribute('y', margin);
        frame.setAttribute('width', SIZE * cellSize);
        frame.setAttribute('height', SIZE * cellSize);
        frame.setAttribute('class', 'svg-grid-border');
        svg.appendChild(frame);

        // 5. Entrance "IN" tag
        if (entrance) {
          const p = parse(entrance);
          if (p) {
            const x = margin + p.col * cellSize + 6;
            const y = margin + p.row * cellSize + 6;

            const tagRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            tagRect.setAttribute('x', x);
            tagRect.setAttribute('y', y);
            tagRect.setAttribute('width', 28);
            tagRect.setAttribute('height', 18);
            tagRect.setAttribute('fill', '#141216');
            tagRect.setAttribute('stroke', '#c9a24a');
            tagRect.setAttribute('class', 'svg-tag-rect');
            svg.appendChild(tagRect);

            const tagText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            tagText.setAttribute('x', x + 14);
            tagText.setAttribute('y', y + 9);
            tagText.setAttribute('fill', '#c9a24a');
            tagText.setAttribute('class', 'svg-tag-text');
            tagText.textContent = 'IN';
            svg.appendChild(tagText);
          }
        }

        // 6. Exit "OUT" tag
        if (exit) {
          const p = parse(exit);
          if (p) {
            const x = margin + p.col * cellSize + cellSize - 36;
            const y = margin + p.row * cellSize + 6;

            const tagRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            tagRect.setAttribute('x', x);
            tagRect.setAttribute('y', y);
            tagRect.setAttribute('width', 30);
            tagRect.setAttribute('height', 18);
            tagRect.setAttribute('fill', '#141216');
            tagRect.setAttribute('stroke', '#c0182f');
            tagRect.setAttribute('class', 'svg-tag-rect');
            svg.appendChild(tagRect);

            const tagText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            tagText.setAttribute('x', x + 15);
            tagText.setAttribute('y', y + 9);
            tagText.setAttribute('fill', '#c0182f');
            tagText.setAttribute('class', 'svg-tag-text');
            tagText.textContent = 'OUT';
            svg.appendChild(tagText);
          }
        }

        // 7. Known Open passages (dashed connectors)
        if (visibleOpen && visibleOpen.size > 0) {
          visibleOpen.forEach(ek => {
            const parts = ek.split('-');
            const p1 = parse(parts[0]);
            const p2 = parse(parts[1]);
            if (p1 && p2) {
              const x1 = margin + p1.col * cellSize + cellSize / 2;
              const y1 = margin + p1.row * cellSize + cellSize / 2;
              const x2 = margin + p2.col * cellSize + cellSize / 2;
              const y2 = margin + p2.row * cellSize + cellSize / 2;

              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              line.setAttribute('x1', x1);
              line.setAttribute('y1', y1);
              line.setAttribute('x2', x2);
              line.setAttribute('y2', y2);
              line.setAttribute('class', 'svg-passage');
              svg.appendChild(line);
            }
          });
        }

        // 8. Visible Walls (revealed or own maze)
        if (visibleWalls && visibleWalls.size > 0) {
          visibleWalls.forEach(ek => {
            const parts = ek.split('-');
            const p1 = parse(parts[0]);
            const p2 = parse(parts[1]);
            if (p1 && p2) {
              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');

              // Vertical edge (horizontal step)
              if (p1.row === p2.row) {
                const minCol = Math.min(p1.col, p2.col);
                const x = margin + (minCol + 1) * cellSize;
                const y1 = margin + p1.row * cellSize + 3;
                const y2 = margin + (p1.row + 1) * cellSize - 3;
                line.setAttribute('x1', x);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x);
                line.setAttribute('y2', y2);
              } else {
                // Horizontal edge (vertical step)
                const minRow = Math.min(p1.row, p2.row);
                const y = margin + (minRow + 1) * cellSize;
                const x1 = margin + p1.col * cellSize + 3;
                const x2 = margin + (p1.col + 1) * cellSize - 3;
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y);
              }

              let cls = 'svg-wall';
              if (flashWall && flashWall === ek) {
                cls += ' svg-wall-flash';
              }
              line.setAttribute('class', cls);
              svg.appendChild(line);
            }
          });
        }

        // 9. Token (Gold ring with dark center)
        if (tokenPos) {
          const p = parse(tokenPos);
          if (p) {
            const cx = margin + p.col * cellSize + cellSize / 2;
            const cy = margin + p.row * cellSize + cellSize / 2;

            const outer = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            outer.setAttribute('cx', cx);
            outer.setAttribute('cy', cy);
            outer.setAttribute('r', 21);
            outer.setAttribute('class', 'svg-token-outer');
            svg.appendChild(outer);

            const inner = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            inner.setAttribute('cx', cx);
            inner.setAttribute('cy', cy);
            inner.setAttribute('r', 7.5);
            inner.setAttribute('class', 'svg-token-inner');
            svg.appendChild(inner);
          }
        }

        return svg;
      }

      /* ==========================================================================
         6. STATE MACHINE ROUTING & RENDERERS (Section 6)
         ========================================================================== */
      const appEl = document.getElementById('app');

      /**
       * Safe helper to set text content
       */
      function el(tag, className = '', text = '') {
        const elem = document.createElement(tag);
        if (className) elem.className = className;
        if (text) elem.textContent = text;
        return elem;
      }

      /**
       * Primary state transition dispatcher
       */
      function setPhase(newPhase) {
        state.phase = newPhase;
        state.currentMessage = { text: '', type: 'normal' };
        render();
      }

      /**
       * Master render entry point
       */
      function render() {
        appEl.innerHTML = '';

        switch (state.phase) {
          case 'TITLE':
            renderTitleScreen();
            break;
          case 'RULES':
            renderRulesScreen();
            break;
          case 'HANDOFF':
            renderHandoffScreen();
            break;
          case 'BUILD':
            renderBuildScreen();
            break;
          case 'COINFLIP':
            renderCoinflipScreen();
            break;
          case 'SOLVE':
            renderSolveScreen();
            break;
          case 'GAMEOVER':
            renderGameoverScreen();
            break;
          default:
            renderTitleScreen();
        }
      }

      /* --------------------------------------------------------------------------
         6.1 TITLE SCREEN
         -------------------------------------------------------------------------- */
      function renderTitleScreen() {

        const boardWrapper = el('div', 'board-wrapper');
        const boardSvg = createBoardSvg({
          entrance: maze.entrance,
          exit: maze.exit,
          visibleWalls: maze.walls,
          onSquareClick: (sq) => {
            // Quick set entrance or exit if not set, or prefill input
            if (!maze.entrance) {
              maze.entrance = sq;
              renderBuildScreen();
            } else if (!maze.exit && sq !== maze.entrance) {
              maze.exit = sq;
              renderBuildScreen();
            } else {
              const input = document.getElementById('build-input');
              if (input) {
                if (!input.value) {
                  input.value = sq + '-';
                  input.focus();
                } else if (input.value.endsWith('-')) {
                  input.value = input.value + sq;
                  handleBuildSubmit(input.value);
                }
              }
            }
          }
        });
        boardWrapper.appendChild(boardSvg);
        container.appendChild(boardWrapper);

        // Status message
        const statusBox = el('div', 'status-msg', state.currentMessage.text);
        if (state.currentMessage.type === 'error') {
          statusBox.className = 'status-msg error';
        } else if (state.currentMessage.type === 'success') {
          statusBox.className = 'status-msg success';
        }
        container.appendChild(statusBox);

        // Input Form
        const form = el('form', 'action-bar');
        form.onsubmit = (e) => {
          e.preventDefault();
          const val = inputField.value.trim();
          handleBuildSubmit(val);
        };

        const inputField = el('input', 'input-field');
        inputField.id = 'build-input';
        inputField.type = 'text';
        inputField.placeholder = 'e.g. entrance A1, exit F6, or A3-B3';
        inputField.autocapitalize = 'off';
        inputField.autocomplete = 'off';
        inputField.autocorrect = 'off';
        inputField.spellcheck = false;
        inputField.enterKeyHint = 'go';

        const submitBtn = el('button', 'btn btn-gold', 'Add');
        submitBtn.type = 'submit';

        form.appendChild(inputField);
        form.appendChild(submitBtn);
        container.appendChild(form);

        // Removable Wall Chips Panel
        if (maze.walls.size > 0) {
          const chipsPanel = el('div', 'chips-panel');
          const chipsHeader = el('div', 'kicker');
          chipsHeader.style.textAlign = 'left';
          chipsHeader.style.marginBottom = '0.35rem';
          chipsHeader.textContent = `Active Walls (${maze.walls.size}):`;
          chipsPanel.appendChild(chipsHeader);

          const chipsList = el('div', 'chips-list');
          const sortedWalls = Array.from(maze.walls).sort();
          sortedWalls.forEach(w => {
            const chip = el('span', 'wall-chip');
            const chipText = el('span', '', w);
            const chipX = el('button', 'wall-chip-btn', '×');
            chipX.type = 'button';
            chipX.title = `Remove ${w}`;
            chipX.addEventListener('click', () => {
              maze.walls.delete(w);
              state.currentMessage = { text: `Removed wall ${w}.`, type: 'normal' };
              renderBuildScreen();
            });
            chip.appendChild(chipText);
            chip.appendChild(chipX);
            chipsList.appendChild(chip);
          });
          chipsPanel.appendChild(chipsList);
          container.appendChild(chipsPanel);
        }

        // Action Toolbar (Random, Clear, Confirm)
        const toolbar = el('div');
        toolbar.style.display = 'grid';
        toolbar.style.gridTemplateColumns = '1fr 1fr 2fr';
        toolbar.style.gap = '0.5rem';
        toolbar.style.marginTop = '0.5rem';

        const randomBtn = el('button', 'btn btn-ghost', 'Random');
        randomBtn.type = 'button';
        randomBtn.title = 'Generate valid random labyrinth';
        randomBtn.addEventListener('click', () => {
          const rm = randomMaze();
          maze.entrance = rm.entrance;
          maze.exit = rm.exit;
          maze.walls = rm.walls;
          state.currentMessage = { text: 'Random solvable labyrinth generated.', type: 'success' };
          renderBuildScreen();
        });

        const clearBtn = el('button', 'btn btn-ghost', 'Clear');
        clearBtn.type = 'button';
        clearBtn.addEventListener('click', () => {
          showConfirmationModal('Clear all walls and points from this maze?', () => {
            maze.entrance = null;
            maze.exit = null;
            maze.walls.clear();
            state.currentMessage = { text: 'Maze reset.', type: 'normal' };
            renderBuildScreen();
          });
        });

        const confirmBtn = el('button', 'btn btn-gold', 'Confirm Maze');
        confirmBtn.type = 'button';
        const isReady = (maze.entrance && maze.exit && maze.walls.size === WALL_COUNT);
        confirmBtn.disabled = !isReady;

        confirmBtn.addEventListener('click', () => {
          if (!maze.entrance || !maze.exit) {
            state.currentMessage = { text: 'Entrance and exit must both be set.', type: 'error' };
            renderBuildScreen();
            return;
          }
          if (maze.entrance === maze.exit) {
            state.currentMessage = { text: 'Entrance and exit must be different squares.', type: 'error' };
            renderBuildScreen();
            return;
          }
          if (maze.walls.size !== WALL_COUNT) {
            state.currentMessage = { text: `Place exactly 20 walls. You have ${maze.walls.size}.`, type: 'error' };
            renderBuildScreen();
            return;
          }
          // Validate BFS solvability
          if (!bfsSolvable(maze.entrance, maze.exit, maze.walls)) {
            state.currentMessage = { text: 'No route from entrance to exit. Remove some walls.', type: 'error' };
            renderBuildScreen();
            return;
          }

          // Maze valid and locked in!
          if (state.current === 0) {
            // Player 1 confirmed -> Pass to Player 2
            state.handoffTarget = 1;
            state.handoffNextPhase = 'BUILD';
            setPhase('HANDOFF');
          } else {
            // Player 2 confirmed -> Coin Flip
            setPhase('COINFLIP');
          }
        });

        toolbar.appendChild(randomBtn);
        toolbar.appendChild(clearBtn);
        toolbar.appendChild(confirmBtn);
        container.appendChild(toolbar);

        appEl.appendChild(container);
        inputField.focus();

        // Build command handler
        function handleBuildSubmit(raw) {
          if (!raw) return;
          const lower = raw.trim().toLowerCase();

          // Clear shortcut
          if (lower === 'clear') {
            showConfirmationModal('Clear all walls and points from this maze?', () => {
              maze.entrance = null;
              maze.exit = null;
              maze.walls.clear();
              state.currentMessage = { text: 'Maze reset.', type: 'normal' };
              renderBuildScreen();
            });
            return;
          }

          // Random shortcut
          if (lower === 'random') {
            const rm = randomMaze();
            maze.entrance = rm.entrance;
            maze.exit = rm.exit;
            maze.walls = rm.walls;
            state.currentMessage = { text: 'Random solvable labyrinth generated.', type: 'success' };
            renderBuildScreen();
            return;
          }

          // Entrance command: "entrance a1", "in a1"
          const entMatch = lower.match(/^(?:entrance|in)\s*[:=]?\s*([a-f][1-6])$/);
          if (entMatch) {
            const targetSq = entMatch[1].toUpperCase();
            if (maze.exit && maze.exit === targetSq) {
              state.currentMessage = { text: 'Entrance and exit must be different squares.', type: 'error' };
            } else {
              maze.entrance = targetSq;
              state.currentMessage = { text: `Entrance set to ${targetSq}.`, type: 'success' };
            }
            renderBuildScreen();
            return;
          }

          // Exit command: "exit f6", "out f6"
          const extMatch = lower.match(/^(?:exit|out)\s*[:=]?\s*([a-f][1-6])$/);
          if (extMatch) {
            const targetSq = extMatch[1].toUpperCase();
            if (maze.entrance && maze.entrance === targetSq) {
              state.currentMessage = { text: 'Entrance and exit must be different squares.', type: 'error' };
            } else {
              maze.exit = targetSq;
              state.currentMessage = { text: `Exit set to ${targetSq}.`, type: 'success' };
            }
            renderBuildScreen();
            return;
          }

          // Remove command: "remove a3-b3", "delete a3-b3"
          const rmMatch = lower.match(/^(?:remove|delete|rm)\s+([a-f0-9\s\u2013\u2014-]*)$/);
          if (rmMatch) {
            const res = parseEdgeInput(rmMatch[1]);
            if (!res.ok) {
              state.currentMessage = { text: res.message, type: 'error' };
            } else if (!maze.walls.has(res.edgeKey)) {
              state.currentMessage = { text: 'That wall does not exist.', type: 'error' };
            } else {
              maze.walls.delete(res.edgeKey);
              state.currentMessage = { text: `Removed wall ${res.edgeKey}.`, type: 'normal' };
            }
            renderBuildScreen();
            return;
          }

          // Wall placement: "a3-b3", "a3 - b3", "a3–b3", "a3 b3"
          const edgeRes = parseEdgeInput(lower);
          if (edgeRes.ok) {
            const ek = edgeRes.edgeKey;
            if (maze.walls.has(ek)) {
              state.currentMessage = { text: 'That wall already exists.', type: 'error' };
            } else if (maze.walls.size >= WALL_COUNT) {
              state.currentMessage = { text: 'You have already placed 20 walls.', type: 'error' };
            } else {
              maze.walls.add(ek);
              state.currentMessage = { text: `Wall ${ek} placed. (${maze.walls.size}/${WALL_COUNT})`, type: 'success' };
            }
            renderBuildScreen();
            return;
          }

          // If square only e.g. "A1"
          if (/^[a-f][1-6]$/.test(lower)) {
            state.currentMessage = {
              text: `Specify "entrance ${lower.toUpperCase()}" or "exit ${lower.toUpperCase()}".`,
              type: 'error'
            };
            renderBuildScreen();
            return;
          }

          state.currentMessage = { text: edgeRes.message, type: 'error' };
          renderBuildScreen();
        }
      }

      /* --------------------------------------------------------------------------

         -------------------------------------------------------------------------- */

      /* --------------------------------------------------------------------------
         6.6 SOLVE SCREEN (Section 6.6, 7.4-7.6)
         -------------------------------------------------------------------------- */
      function renderSolveScreen() {
        const solverIdx = state.current;
        const solverName = state.names[solverIdx];
        const opponentIdx = 1 - solverIdx;
        const opponentName = state.names[opponentIdx];

        const opponentMaze = state.mazes[opponentIdx];
        const solveState = state.solves[solverIdx];

        const container = el('div');
        container.style.width = '100%';
        container.style.maxWidth = '560px';

        // Top bar
        const topBar = el('div', 'top-bar');
        const turnTitle = el('div', 'top-bar-brand', `${solverName.toUpperCase()}'S TURN`);
        const rulesBtn = el('button', 'btn btn-ghost btn-icon', '?');
        rulesBtn.title = 'Rules';
        rulesBtn.addEventListener('click', () => {
          state.returnTo = 'SOLVE';
          setPhase('RULES');
        });
        topBar.appendChild(turnTitle);
        topBar.appendChild(rulesBtn);
        container.appendChild(topBar);

        // Infiltration HUD
        const hud = el('div');
        hud.style.display = 'flex';
        hud.style.justifyContent = 'space-between';
        hud.style.fontSize = '0.85rem';
        hud.style.color = 'var(--gold-dim)';
        hud.style.marginBottom = '0.4rem';
        hud.style.padding = '0 0.2rem';

        const posTag = el('span', '', `Position: ${solveState.pos}`);
        posTag.style.color = 'var(--gold)';
        posTag.style.fontWeight = 'bold';
        const exitTag = el('span', '', `Exit: ${opponentMaze.exit}`);
        exitTag.style.color = 'var(--crimson-bright)';
        const guessTag = el('span', '', `Guesses: ${solveState.guesses}`);

        hud.appendChild(posTag);
        hud.appendChild(exitTag);
        hud.appendChild(guessTag);
        container.appendChild(hud);

        // Solver's Private Board (ONLY knownOpen and knownWalls rendered)
        // UNREVEALED WALLS ARE NEVER RENDERED!
        const boardWrapper = el('div', 'board-wrapper');
        const boardSvg = createBoardSvg({
          entrance: opponentMaze.entrance,
          exit: opponentMaze.exit,
          visibleWalls: solveState.knownWalls,
          visibleOpen: solveState.knownOpen,
          tokenPos: solveState.pos,
          onSquareClick: (sq) => {
            const input = document.getElementById('step-input');
            if (input) {
              input.value = sq;
              input.focus();
            }
          }
        });
        boardWrapper.appendChild(boardSvg);

        // BLOCKED ink stamp overlay if momentarily active
        if (state.blockedStampActive) {
          const stampOverlay = el('div', 'blocked-stamp-overlay');
          const stamp = el('div', 'ink-stamp', 'BLOCKED');
          stampOverlay.appendChild(stamp);
          boardWrapper.appendChild(stampOverlay);
        }

        container.appendChild(boardWrapper);

        // Status Message Banner
        const statusBox = el('div', 'status-msg', state.currentMessage.text || `Step to an adjacent square to infiltrate ${opponentName}'s maze.`);
        if (state.currentMessage.type === 'error') {
          statusBox.className = 'status-msg error';
        } else if (state.currentMessage.type === 'success') {
          statusBox.className = 'status-msg success';
        } else if (state.currentMessage.type === 'blocked') {
          statusBox.className = 'status-msg blocked';
        }
        container.appendChild(statusBox);

        // Step Input Form
        const form = el('form', 'action-bar');
        form.onsubmit = (e) => {
          e.preventDefault();
          if (state.blockedStampActive) return;
          const val = inputField.value.trim();
          handleSolveStep(val);
        };

        const inputField = el('input', 'input-field');
        inputField.id = 'step-input';
        inputField.type = 'text';
        inputField.placeholder = `Step to adjacent square (e.g. ${neighbors(solveState.pos)[0] || 'B3'})`;
        inputField.autocapitalize = 'off';
        inputField.autocomplete = 'off';
        inputField.autocorrect = 'off';
        inputField.spellcheck = false;
        inputField.enterKeyHint = 'go';

        const stepBtn = el('button', 'btn btn-gold', 'Step');
        stepBtn.type = 'submit';

        form.appendChild(inputField);
        form.appendChild(stepBtn);
        container.appendChild(form);

        // Move Log (Section 7.6 - aria-live="polite", only solver's own log)
        const logPanel = el('div', 'log-panel');
        logPanel.setAttribute('aria-live', 'polite');
        logPanel.setAttribute('aria-relevant', 'additions');

        const logTitle = el('div', 'log-title');
        logTitle.appendChild(el('span', '', `${solverName}'s Log`));
        logTitle.appendChild(el('span', '', `${solveState.log.length} steps`));
        logPanel.appendChild(logTitle);

        const logList = el('ul', 'log-items');
        if (solveState.log.length === 0) {
          const emptyLog = el('li', 'log-entry');
          emptyLog.style.color = 'var(--muted)';
          emptyLog.textContent = 'No steps taken yet.';
          logList.appendChild(emptyLog);
        } else {
          solveState.log.forEach(entry => {
            const isBlk = entry.includes('BLOCKED');
            const item = el('li', `log-entry ${isBlk ? 'blocked' : 'open'}`, entry);
            logList.appendChild(item);
          });
        }
        logPanel.appendChild(logList);
        container.appendChild(logPanel);

        appEl.appendChild(container);
        if (!state.blockedStampActive) {
          inputField.focus();
        }

        // Solve step executor
        function handleSolveStep(targetStr) {
          const curPos = solveState.pos;
          const res = resolveMove(targetStr, curPos, opponentMaze.walls, opponentMaze.exit);

          // 1 & 2: Malformed or Not Adjacent -> Reject without penalty
          if (res.status === 'MALFORMED' || res.status === 'NOT_ADJACENT') {
            state.currentMessage = { text: res.message, type: 'error' };
            renderSolveScreen();
            return;
          }

          // 3: BLOCKED by wall
          if (res.status === 'BLOCKED') {
            solveState.knownWalls.add(res.edge);
            solveState.guesses++;
            const logEntry = `${curPos} -> ${res.target} BLOCKED`;
            solveState.log.unshift(logEntry);

            state.currentMessage = { text: res.message, type: 'blocked' };
            state.blockedStampActive = true;
            renderSolveScreen();

            // After stamp display (~1.4s), transition to HANDOFF for other player
            const nextPlayer = 1 - solverIdx;
            const timer = setTimeout(() => {
              state.blockedStampActive = false;
              state.handoffTarget = nextPlayer;
              state.handoffNextPhase = 'SOLVE';
              setPhase('HANDOFF');
            }, 1400);

            // Clicking board/stamp dismisses immediately
            document.querySelector('.blocked-stamp-overlay')?.addEventListener('click', () => {
              clearTimeout(timer);
              state.blockedStampActive = false;
              state.handoffTarget = nextPlayer;
              state.handoffNextPhase = 'SOLVE';
              setPhase('HANDOFF');
            }, { once: true });

            return;
          }

          // 4: Step SUCCEEDS
          if (res.status === 'OPEN') {
            solveState.knownOpen.add(res.edge);
            solveState.pos = res.target;
            solveState.guesses++;
            const logEntry = `${curPos} -> ${res.target} OPEN`;
            solveState.log.unshift(logEntry);

            // 5: Check win condition
            if (res.isWin) {
              state.winner = solverIdx;
              state.phase = 'GAMEOVER';
              state.currentMessage = { text: `${solverName} reaches the exit. ${solverName} wins.`, type: 'success' };
              render();
              return;
            }

            state.currentMessage = { text: res.message, type: 'success' };
            renderSolveScreen();
          }
        }
      }

        rematchBtn.addEventListener('click', () => {

          state.mazes = [

          ];

          state.handoffTarget = 0;
          state.handoffNextPhase = 'BUILD';
          setPhase('HANDOFF');
        });

        const newGameBtn = el('button', 'btn btn-ghost', 'New Game');
        newGameBtn.addEventListener('click', () => {
          setPhase('TITLE');
        });

        actionRow.appendChild(rematchBtn);
        actionRow.appendChild(newGameBtn);
        container.appendChild(actionRow);

        appEl.appendChild(container);
      }

      /* --------------------------------------------------------------------------
         7. CONFIRMATION MODAL HELPER
         -------------------------------------------------------------------------- */
      function showConfirmationModal(questionText, onConfirm) {
        const backdrop = el('div', 'modal-backdrop');
        const box = el('div', 'modal-box');

        const title = el('h3', 'kicker', 'Confirmation Required');
        const q = el('p', 'rules-text', questionText);
        q.style.margin = '1rem 0';

        const row = el('div');
        row.style.display = 'flex';
        row.style.gap = '0.8rem';
        row.style.justifyContent = 'center';

        const cancelBtn = el('button', 'btn btn-ghost', 'Cancel');
        cancelBtn.addEventListener('click', () => {
          backdrop.remove();
        });

        const yesBtn = el('button', 'btn btn-crimson', 'Clear All');
        yesBtn.addEventListener('click', () => {
          backdrop.remove();
          onConfirm();
        });

        row.appendChild(cancelBtn);
        row.appendChild(yesBtn);

        box.appendChild(title);
        box.appendChild(q);
        box.appendChild(row);
        backdrop.appendChild(box);
        document.body.appendChild(backdrop);
        cancelBtn.focus();
      }

      // Initial boot
      render();
    })();
  </script>
</body>
</html>
